# ==========================================================
# PathPilot Multi-Server Production Orchestration
# Redundant App Nodes, Load Balancer, Redis Cache & Network Isolation
# ==========================================================

version: '3.8'

services:
  # --------------------------------------------------------
  # Edge Reverse Proxy & Load Balancer
  # --------------------------------------------------------
  load_balancer:
    image: nginx:alpine
    container_name: pathpilot_lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ssl_certificates:/etc/ssl/certs:ro
    depends_on:
      - app_node_1
      - app_node_2
    networks:
      - pathpilot_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------
  # Application Node 1 (Primary Backend & AI Orchestration)
  # --------------------------------------------------------
  app_node_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathpilot_app_1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis_cache:6379
      - ALLOWED_ORIGINS=https://pathpilot.app,http://localhost:5173
    env_file:
      - .env
    networks:
      - pathpilot_internal
    depends_on:
      - redis_cache
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --------------------------------------------------------
  # Application Node 2 (Redundant High-Availability Worker)
  # --------------------------------------------------------
  app_node_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathpilot_app_2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis_cache:6379
      - ALLOWED_ORIGINS=https://pathpilot.app,http://localhost:5173
    env_file:
      - .env
    networks:
      - pathpilot_internal
    depends_on:
      - redis_cache
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --------------------------------------------------------
  # Distributed Cache & Session Store
  # --------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: pathpilot_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - pathpilot_internal
    deploy:
      resources:
        limits:
          memory: 512M

# ----------------------------------------------------------
# Isolated Network & Persistent Volumes
# ----------------------------------------------------------
networks:
  pathpilot_internal:
    driver: bridge

volumes:
  ssl_certificates:
  redis_data:
