# ==========================================================
# PathPilot Enterprise Production Nginx Configuration
# Reverse Proxy, Load Balancer, SSL Termination & Hardened Security
# ==========================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Prevent version leakage

    # Buffer size restrictions to mitigate buffer overflow attacks
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Rate Limiting Zones (DDoS & Brute-force Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Multi-Server Load Balancing
    upstream pathpilot_nodes {
        least_conn; # Route to node with least active connections
        server app_node_1:4000 max_fails=3 fail_timeout=15s;
        server app_node_2:4000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name pathpilot.app www.pathpilot.app;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pathpilot.app www.pathpilot.app;

        # SSL Certificates (Managed via Cloudflare / Let's Encrypt / Certbot)
        ssl_certificate /etc/ssl/certs/pathpilot.crt;
        ssl_certificate_key /etc/ssl/private/pathpilot.key;

        # Modern TLS Configuration (TLS 1.2 and TLS 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-SecurityPolicy "default-src 'self' https://*.supabase.co https://*.cloudflare.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://remotive.com https://www.arbeitnow.com;" always;

        # Connection limits
        limit_conn conn_limit 20;

        # Root Static Frontend SPA Directory
        root /usr/share/nginx/html;
        index index.html;

        # Static Assets with Immutable Caching
        location ~* \.(?:css|js|woff2?|png|jpe?g|gif|ico|svg|webmanifest)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # API Reverse Proxy with Load Balancing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://pathpilot_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Stricter Rate Limit on Authentication Endpoints
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://pathpilot_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA Routing Fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Block Hidden and Sensitive Files (.git, .env, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
