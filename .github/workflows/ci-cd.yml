# ==========================================================
# PathPilot Enterprise CI/CD Pipeline
# Automated Testing, Security Auditing, Typecheck & Production Deployment
# ==========================================================

name: PathPilot Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------
  # Job 1: Quality, Type Safety & Vulnerability Audit
  # --------------------------------------------------------
  audit_and_validate:
    name: Code Quality, Typecheck & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Exact Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality Inspection
        run: npm run lint

      - name: Automated Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Verify Production Bundle Compilation
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}

  # --------------------------------------------------------
  # Job 2: Multi-Platform Docker Container Verification
  # --------------------------------------------------------
  docker_build_check:
    name: Container Build & Healthcheck Verification
    needs: audit_and_validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pathpilot-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------
  # Job 3: Automated Deployment (Cloudflare Worker / Target Nodes)
  # --------------------------------------------------------
  deploy:
    name: Production Deployment to Cloudflare Edge
    needs: [audit_and_validate, docker_build_check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}

      - name: Deploy to Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
